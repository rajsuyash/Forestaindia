name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Type check, validation tests, build, then the link/meta/alt gate.
      # A failure here means nothing is uploaded.
      - run: pnpm verify

      - name: Add SSH key
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${SSH_PORT:-65002}" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload to Hostinger
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          REMOTE_PATH: ${{ secrets.HOSTINGER_REMOTE_PATH }}
        run: |
          rsync --archive --compress --human-readable --delete \
            --exclude 'secrets.php' \
            --exclude 'vendor/' \
            --exclude '.well-known/' \
            --exclude 'cgi-bin/' \
            --exclude '.htpasswd' \
            --chmod=D755,F644 \
            -e "ssh -p ${SSH_PORT:-65002} -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes" \
            dist/ "${SSH_USER}@${SSH_HOST}:${REMOTE_PATH}/"

      - name: Smoke test live routes
        run: |
          fails=0
          for path in / /product /about /contact /insights; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://forestaindia.com${path}" || echo 000)
            printf '  %-12s %s\n' "$path" "$code"
            [ "$code" = "200" ] || fails=$((fails+1))
          done
          [ "$fails" -eq 0 ] || { echo "::error::$fails route(s) not returning 200"; exit 1; }
